<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Restaurant Orders Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #12121c;
      color: #e0e0e0;
      margin: 0;
      padding: 30px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: #00ffcc;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .table-container {
      background: #1e1e2e;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 15px;
      border-bottom: 1px solid #2e2e3e;
    }
    th {
      background-color: #2a2a3d;
      color: #00ffcc;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    tr:hover {
      background-color: #252538;
    }
    .status {
      font-weight: bold;
      color: #00ff88;
      text-transform: uppercase;
      font-size: 12px;
      background: rgba(0, 255, 136, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .no-orders {
      text-align: center;
      padding: 30px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍔 Live Restaurant Orders</h1>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer ID</th>
            <th>Delivery Address</th>
            <th>Total Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="orders-list">
          <tr>
            <td colspan="5" class="no-orders">Loading orders...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

<script src="/app.js"></script>
</body>
</html>
